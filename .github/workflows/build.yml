name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: App icon from cameroncurrin.com
        run: |
          sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          tools/make_icons.sh

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CamZone.apk
          echo "${{ github.run_number }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CamZone-apk
          path: CamZone.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          (cd luts && zip -q ../CamZone_LUTs.zip CamZone_*.cube CamZone_Legend.png "Install CamZone LUTs in Resolve.bat")
          gh release create latest CamZone.apk version.txt CamZone_LUTs.zip luts/CamZone_Map_Gen5.cube luts/CamZone_Map_Moody_Gen5.cube luts/CamZone_Map_LowKey_Gen5.cube luts/CamZone_Guard_Gen5.cube luts/CamZone_Map_DWG.cube luts/CamZone_Guard_DWG.cube luts/CamZone_Legend.png \
            --title "Cam Zone (latest build)" \
            --notes "Install CamZone.apk on the Pixel. PYXIS: load the _Gen5 .cube files (Map, Map Moody, Map LowKey, Guard). Resolve: unzip CamZone_LUTs.zip and run the Install bat."
