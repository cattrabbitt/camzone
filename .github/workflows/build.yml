name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CamZone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CamZone-apk
          path: CamZone.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CamZone.apk luts/CamZone_Map_Gen5.cube luts/CamZone_Guard_Gen5.cube luts/CamZone_Legend.png \
            --title "Cam Zone (latest build)" \
            --notes "Install CamZone.apk on the Pixel. Load the two .cube files onto the PYXIS."
